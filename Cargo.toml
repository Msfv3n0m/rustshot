[package]
name = "rustshot"
version = "0.3.0"
edition = "2021"
rust-version = "1.70"
description = "Capture terminal command output as beautiful PNG images"
license = "MIT"
repository = "https://github.com/Msfv3n0m/rustshot"
homepage = "https://github.com/Msfv3n0m/rustshot"
readme = "README.md"
keywords = ["screenshot", "terminal", "cli", "png", "ansi"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"
portable-pty = "0.8"
vt100 = "0.15"
anyhow = "1"
