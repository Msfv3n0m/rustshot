name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../rustshot-${{ github.ref_name }}-x86_64-linux.tar.gz rustshot

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../rustshot-${{ github.ref_name }}-x86_64-windows.zip rustshot.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: rustshot-*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            ## rustshot ${{ github.ref_name }}

            Capture terminal command output as beautiful PNG images.

            ### Downloads
            - **Linux (x86_64)**: `rustshot-${{ github.ref_name }}-x86_64-linux.tar.gz`
            - **Windows (x86_64)**: `rustshot-${{ github.ref_name }}-x86_64-windows.zip`

            ### Install from source
            ```
            cargo install --git https://github.com/Msfv3n0m/rustshot.git --tag ${{ github.ref_name }}
            ```

            ### Usage
            ```
            rustshot -- "echo hello world"
            rustshot -c -f screenshot.png -- "git status" "git log --oneline -5"
            command | rustshot -f output.png
            ```
          files: artifacts/*
