name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Linux)
        if: runner.os == 'Linux'
        run: cp target/${{ matrix.target }}/release/rustshot rustshot-x86_64-linux

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/rustshot.exe rustshot-x86_64-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: rustshot-x86_64-*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: false
          body: |
            ## rustshot ${{ env.RELEASE_TAG }}

            Capture terminal command output as beautiful PNG images.

            ### Downloads
            - **Linux (x86_64)**: `rustshot-x86_64-linux`
            - **Windows (x86_64)**: `rustshot-x86_64-windows.exe`

            ### Install from source
            ```
            cargo install --git https://github.com/Msfv3n0m/rustshot.git --tag ${{ env.RELEASE_TAG }}
            ```

            ### Usage
            ```
            rustshot -- "echo hello world"
            rustshot -f screenshot.png -- "git status" "git log --oneline -5"
            command | rustshot -f output.png
            ```
          files: artifacts/*
