name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve-tag
    if: needs.resolve-tag.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Linux gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cp target/${{ matrix.target }}/release/rustshot rustshot-x86_64-linux

      - name: Rename binary (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cp target/${{ matrix.target }}/release/rustshot rustshot-x86_64-linux-static

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/rustshot.exe rustshot-x86_64-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: rustshot-x86_64-*

  release:
    needs: [resolve-tag, build]
    if: needs.resolve-tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create tag
        run: |
          git tag ${{ needs.resolve-tag.outputs.tag }}
          git push origin ${{ needs.resolve-tag.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          generate_release_notes: false
          body: |
            ## rustshot ${{ needs.resolve-tag.outputs.tag }}

            Capture terminal command output as beautiful PNG images.

            ### Downloads
            - **Linux (x86_64)**: `rustshot-x86_64-linux`
            - **Linux (x86_64, static)**: `rustshot-x86_64-linux-static`
            - **Windows (x86_64)**: `rustshot-x86_64-windows.exe`

            ### Install from source
            ```
            cargo install --git https://github.com/Msfv3n0m/rustshot.git --tag ${{ needs.resolve-tag.outputs.tag }}
            ```

            ### Usage
            ```
            rustshot -- "echo hello world"
            rustshot -f screenshot.png -- "git status" "git log --oneline -5"
            command | rustshot -f output.png
            ```
          files: artifacts/*
